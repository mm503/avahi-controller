name: Release Please

on:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: mm404/avahi-controller
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o controller-linux-amd64 ./cmd/controller/
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o controller-linux-arm64 ./cmd/controller/

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: controller-binaries
          path: controller-linux-*
          retention-days: 1
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image (no push)
        run: docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile.release .

  release-please:
    runs-on: ubuntu-latest
    needs: build-check
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker-release:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Strip v prefix from tag
        id: version
        run: echo "version=$(echo '${{ needs.release-please.outputs.tag_name }}' | sed 's/^v//')" >> $GITHUB_OUTPUT

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: controller-binaries

      - name: Restore executable bit
        run: chmod +x controller-linux-amd64 controller-linux-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: mm404
          password: ${{ secrets.DOCKER_HUB_KEY }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch images
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          GHCR_IMAGE=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          VERSION=${{ steps.version.outputs.version }}
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile.release --push \
            -t ${IMAGE}:${VERSION} \
            -t ${IMAGE}:latest \
            -t ${GHCR_IMAGE}:${VERSION} \
            -t ${GHCR_IMAGE}:latest .

  helm-release:
    runs-on: ubuntu-latest
    needs: [release-please, docker-release]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Checkout chart repository index
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Check versions match the release
        run: scripts/check-versions.sh "${TAG#v}"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      # The chart is attached to the app's GitHub release instead of getting a
      # release of its own. Only index.yaml changes on gh-pages: older entries
      # keep pointing at their avahi-controller-0.1.x releases, and
      # artifacthub-repo.yml (Artifact Hub verified publisher) is left alone.
      - name: Package chart and attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir .chart
          helm package charts/avahi-controller --destination .chart
          gh release upload "$TAG" .chart/*.tgz --clobber

      - name: Update chart repository index
        run: |
          helm repo index .chart \
            --url "https://github.com/${{ github.repository }}/releases/download/${TAG}" \
            --merge gh-pages/index.yaml
          cp .chart/index.yaml gh-pages/index.yaml
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.yaml
          git commit -m "Release avahi-controller chart ${TAG#v}"
          git push origin HEAD:gh-pages
