name: Release Please

on:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: mm404/avahi-controller
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o controller-linux-amd64 ./cmd/controller/
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o controller-linux-arm64 ./cmd/controller/

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: controller-binaries
          path: controller-linux-*
          retention-days: 1
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image (no push)
        run: docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile.release .

  release-please:
    runs-on: ubuntu-latest
    needs: build-check
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker-release:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Strip v prefix from tag
        id: version
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: controller-binaries

      - name: Restore executable bit
        run: chmod +x controller-linux-amd64 controller-linux-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: mm404
          password: ${{ secrets.DOCKER_HUB_KEY }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch images
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          GHCR_IMAGE=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          VERSION=${{ steps.version.outputs.version }}
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile.release --push \
            -t ${IMAGE}:${VERSION} \
            -t ${IMAGE}:latest \
            -t ${GHCR_IMAGE}:${VERSION} \
            -t ${GHCR_IMAGE}:latest .

  update-chart:
    runs-on: ubuntu-latest
    needs: [release-please, docker-release]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Update chart appVersion and image tag
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" charts/avahi-controller/Chart.yaml
          sed -i -E "s|(image: .*/avahi-controller):.*|\1:${VERSION}|" charts/avahi-controller/Chart.yaml
          sed -i "s/^  tag: .*/  tag: \"${VERSION}\"/" charts/avahi-controller/values.yaml
          sed -i -E "s|(image: .*/avahi-controller):.*|\1:${VERSION}|" deploy/deployment.yaml

      - name: Bump chart version
        run: |
          CHART_VERSION=$(grep '^version:' charts/avahi-controller/Chart.yaml | awk '{print $2}')
          NEW_CHART_VERSION=$(echo "$CHART_VERSION" | awk -F. '{$NF = $NF + 1; print}' OFS='.')
          sed -i "s/^version: .*/version: ${NEW_CHART_VERSION}/" charts/avahi-controller/Chart.yaml

      - name: Open checked chart update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chart/${{ needs.release-please.outputs.tag_name }}"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/avahi-controller/Chart.yaml charts/avahi-controller/values.yaml deploy/deployment.yaml
          git commit -m "chore(chart): update to app version ${{ needs.release-please.outputs.tag_name }}"
          git push --set-upstream origin "$BRANCH"
          printf '%s\n' 'Update chart and raw manifest to the released controller version. Chart publication follows merge after required checks pass.' > "$RUNNER_TEMP/chart-pr-body.md"
          gh pr create --base main --head "$BRANCH" --title "chore(chart): update to ${{ needs.release-please.outputs.tag_name }}" --body-file "$RUNNER_TEMP/chart-pr-body.md"
          # GITHUB_TOKEN pushes do not trigger CI; workflow_dispatch does.
          gh workflow run ci.yml --ref "$BRANCH"

