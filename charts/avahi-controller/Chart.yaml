apiVersion: v2
name: avahi-controller
description: Publishes Kubernetes LoadBalancer Service IPs as .local names over mDNS through the node's avahi-daemon
type: application
home: https://github.com/mm503/avahi-controller
icon: https://raw.githubusercontent.com/avahi/avahi/refs/heads/master/docs/avahi-logo.png
sources:
  - https://github.com/mm503/avahi-controller
maintainers:
  - name: mm503
    url: https://github.com/mm503
keywords:
  - avahi
  - mdns
  - dns
  - local
  - metallb
# The chart is released together with the controller and carries the same
# version. release-please updates every line marked x-release-please-version
# (and the marked block below) in its release PR; see scripts/check-versions.sh.
version: 1.0.7 # x-release-please-version
appVersion: "1.0.7" # x-release-please-version
annotations:
  artifacthub.io/license: MIT
  # x-release-please-start-version
  artifacthub.io/images: |
    - name: avahi-controller
      image: ghcr.io/mm503/avahi-controller:1.0.7
      platforms:
        - linux/amd64
        - linux/arm64
  # x-release-please-end
  # Artifact Hub shows these for the version being released. Replace them
  # (or remove them) in the next release so they do not carry over. Add
  # artifacthub.io/containsSecurityUpdates: "true" only for a release that
  # fixes a security issue.
  artifacthub.io/changes: |
    - kind: fixed
      description: Services sharing one LoadBalancer IP no longer produce hosts lines that avahi-daemon silently drops. One hostname per IP is published and the others get a SharedIPConflict warning event
    - kind: fixed
      description: Services publishing the same hostname for the same IP no longer raise a HostnameConflict warning
    - kind: added
      description: NodeAddress warning event when a LoadBalancer IP is the node's own address, which avahi-daemon does not publish. Uses the new HOST_IP environment variable
    - kind: changed
      description: Documentation now lists the limitations (one node, one hostname per IP, no node addresses) and alternatives
