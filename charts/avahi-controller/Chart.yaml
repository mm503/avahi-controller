apiVersion: v2
name: avahi-controller
description: A Helm chart for avahi-controller
type: application
home: https://github.com/mm503/avahi-controller
icon: https://raw.githubusercontent.com/avahi/avahi/refs/heads/master/docs/avahi-logo.png
sources:
  - https://github.com/mm503/avahi-controller
maintainers:
  - name: mm503
    url: https://github.com/mm503
keywords:
  - avahi
  - mdns
  - dns
  - local
  - metallb
# The chart is released together with the controller and carries the same
# version. release-please updates every line marked x-release-please-version
# (and the marked block below) in its release PR; see scripts/check-versions.sh.
version: 1.0.2 # x-release-please-version
appVersion: "1.0.2" # x-release-please-version
annotations:
  artifacthub.io/license: MIT
  # x-release-please-start-version
  artifacthub.io/images: |
    - name: avahi-controller
      image: ghcr.io/mm503/avahi-controller:1.0.2
      platforms:
        - linux/amd64
        - linux/arm64
  # x-release-please-end
  # Artifact Hub shows these for the version being released. Replace them
  # (or remove them) in the next release so they do not carry over.
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: security
      description: The chart no longer mounts the host D-Bus socket, which gave the root container control of systemd on the node
    - kind: removed
      description: The --reload and --avahi-service flags; avahi-daemon already reloads the hosts file when it changes. Remove them from args before upgrading
    - kind: changed
      description: The chart version now matches the controller version, so it jumps from 0.1.19 to the controller release
    - kind: fixed
      description: --cleanup-on-exit no longer makes avahi-daemon reload when there is nothing to remove
