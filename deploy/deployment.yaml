apiVersion: apps/v1
kind: Deployment
metadata:
  name: avahi-controller
  namespace: kube-system
  labels:
    app: avahi-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: avahi-controller
  template:
    metadata:
      labels:
        app: avahi-controller
    spec:
      serviceAccountName: avahi-controller
      nodeSelector:
        avahi-controller: "true"
      tolerations:
        - operator: Exists   # tolerate any taint on the designated node
      terminationGracePeriodSeconds: 30
      volumes:
        - name: avahi-hosts
          hostPath:
            path: /etc/avahi/hosts
            type: FileOrCreate
      containers:
        - name: controller
          image: ghcr.io/mm503/avahi-controller:0.6.4
          imagePullPolicy: IfNotPresent
          args:
            - --cleanup-on-exit=false
            - --verbose
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: avahi-hosts
              mountPath: /etc/avahi/hosts
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
